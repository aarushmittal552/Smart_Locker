<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>System Logs - Smart Locker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(2, 6, 23, 0.9);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .logs-card {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logs-header h2 {
            margin: 0;
            font-size: 18px;
            color: #e2e8f0;
        }

        .refresh-indicator {
            font-size: 12px;
            color: #64748b;
        }

        #log-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 500px;
            overflow-y: auto;
        }

        #log-list li {
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            border-left: 4px solid #64748b;
            transition: background 0.2s ease;
        }

        #log-list li:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Color coding for log types */
        .log-intruder {
            border-left-color: #ef4444 !important;
            color: #fca5a5 !important;
            background: rgba(239, 68, 68, 0.1) !important;
        }

        .log-admin {
            border-left-color: #22c55e !important;
            color: #86efac !important;
            background: rgba(34, 197, 94, 0.1) !important;
        }

        .log-user {
            border-left-color: #3b82f6 !important;
            color: #93c5fd !important;
            background: rgba(59, 130, 246, 0.1) !important;
        }

        .timestamp {
            color: #64748b;
            font-size: 12px;
        }

        .message {
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.intruder {
            background: #ef4444;
        }

        .legend-dot.admin {
            background: #22c55e;
        }

        .legend-dot.user {
            background: #3b82f6;
        }
    </style>
</head>

<body>

    <header>
        <h1>📜 System Logs</h1>
        <a href="dashboard.html" class="back-btn">⬅️ Back to Dashboard</a>
    </header>

    <div class="container">
        <div class="logs-card">
            <div class="logs-header">
                <h2>Recent Activity</h2>
                <span class="refresh-indicator">🔄 Auto-refresh every 3s</span>
            </div>

            <ul id="log-list">
                <li class="empty-state">Loading logs...</li>
            </ul>

            <div class="legend">
                <div class="legend-item">
                    <span class="legend-dot intruder"></span>
                    <span>Intruder Alert</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot admin"></span>
                    <span>Admin Action</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot user"></span>
                    <span>User Action</span>
                </div>
            </div>
        </div>
    </div>

    <script src="logs.js"></script>
</body>

</html>
